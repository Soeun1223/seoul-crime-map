name: Update crime data

# 공공데이터포털 API로 경찰청 범죄 통계를 받아 data/seoul-crime-2024.json을 갱신한다.
# 인증키는 저장소 Settings → Secrets and variables → Actions에 DATA_GO_KR_KEY로 저장한다.
# 매달 1일에 한 번 돌고, Actions 탭에서 직접 실행할 수도 있다.
on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch crime statistics from API
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python3 scripts/fetch_crime.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/seoul-crime-2024.json; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git add data/seoul-crime-2024.json
          git commit -m "Update crime data from data.go.kr API"
          git push
